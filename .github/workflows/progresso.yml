name: Progresso da Tradução

on:
  push:
    branches: [dev]
    paths-ignore:
      - README.md
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progresso-dev
  cancel-in-progress: false

jobs:
  progresso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Atualizar README
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          METADATA = {'date'}
          RAIZ = Path('.')

          def carregar(p):
              try:
                  return json.loads(Path(p).read_text(encoding='utf-8'))
              except FileNotFoundError:
                  return {}

          resultados = {}
          caps = sorted(RAIZ.glob('chapter*_windows'))
          prev_en = None
          for cap in caps:
              pt_path = cap / 'traduzido' / 'lang_pt.json'
              en_path = cap / 'original' / 'lang_en.json'
              if not pt_path.exists() or not en_path.exists():
                  continue
              pt = carregar(pt_path)
              en = carregar(en_path)
              chaves = {k for k in set(pt) | set(en) if k not in METADATA}
              exclusivas = chaves - set(prev_en) if prev_en is not None else chaves
              trad = sum(1 for k in exclusivas if k in pt and pt[k] != en.get(k))
              m = re.fullmatch(r'chapter(\d+)_windows', cap.name)
              if m:
                  resultados[int(m.group(1))] = (trad, len(exclusivas))
                  prev_en = en

          if not resultados:
              print('nenhuma pasta de capítulo encontrada.')
              raise SystemExit(1)

          for num, (trad, total) in sorted(resultados.items()):
              print(f'Capítulo {num}: {trad}/{total} = {trad/total*100:.2f}%')

          readme = Path('README.md')
          texto = readme.read_text(encoding='utf-8')

          def atualiza_linha(m):
              num = int(m.group(1))
              if num not in resultados:
                  return m.group(0)
              trad, total = resultados[num]
              pct = trad / total * 100
              return f'| Capítulo {num} |  {pct:.2f}%   |'

          novo = re.sub(
              r'^\|\s*Cap[ií]tulo\s+(\d+)\s*\|.*\|',
              atualiza_linha,
              texto,
              flags=re.M,
          )

          if novo != texto:
              readme.write_text(novo, encoding='utf-8')
              print('README.md atualizado.')
          else:
              print('README.md sem alterações.')
          PY

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA=$(date +%d/%m/%Y)

          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi

          git commit -m "Progresso atualizado para ${DATA}."

          for i in 1 2 3; do
            git fetch origin dev
            if ! git rebase origin/dev; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:dev; then
              exit 0
            fi
            sleep $((i * 3))
          done

          exit 1