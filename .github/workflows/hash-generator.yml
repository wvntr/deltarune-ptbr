name: Gerar Manifest após uma Update

on:
  push:
    branches:
      - main-dev
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Hash-Calc
      run: |
        echo "{" > manifest.json
        echo "  \"files\": [" >> manifest.json
        
        FIRST=true
        
        while read -r arquivo; do
          # calcular MD5
          HASH=$(md5sum "$arquivo" | awk '{print $1}')
          
          # interpreta o JSON
          if [ "$FIRST" = true ]; then
            FIRST=false
          else
            echo "," >> manifest.json
          fi
          
          echo "    { \"path\": \"$arquivo\", \"hash\": \"$HASH\" }" | tr -d '\n' >> manifest.json
        done < <(find chapter*_windows -type f -path '*/traduzido/lang_pt.json' | sort)
        
        echo "" >> manifest.json
        echo "  ]" >> manifest.json
        echo "}" >> manifest.json

    - name: Commit e Push do JSON
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        DATA=$(date +%d/%m/%Y)
        
        git add manifest.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizado para ${DATA}" && git push origin HEAD:${GITHUB_REF_NAME})